<!-- ==========================================================================
     CVBS brief PDF template.

     Rendered by Apps Script's HTML to PDF converter, which is NOT a browser.
     Proven by test on 8 September 2026:
       WORKS  - text colour, borders, rules, tables, images (incl. data URIs)
       FAILS  - every background colour, CSS background and bgcolor alike
       FAILS  - flexbox, grid, CSS variables, web fonts
     So the navy header is a baked PNG, not a coloured table cell, and every
     other block reads through borders and type. Do not "improve" this by
     adding background-color. It will silently render white.

     __BAND__ is the placeholder for the header image. The live copy in the
     Apps Script editor has the base64 inlined there. Regenerate it with
     build-band.js in this folder if the logo or the wording ever changes.
     ========================================================================== -->
<html>
<head><meta charset="utf-8">
<style>
  body   { font-family: Helvetica, Arial, sans-serif; color:#0D1F2D; font-size:11pt; line-height:1.45; margin:0; }
  table  { border-collapse:collapse; width:100%; }

  .refline { margin:9px 0 0; font-size:9pt; color:#6E747B; text-align:right; }
  .refline strong { color:#0A2C52; font-size:11.5pt; letter-spacing:0.4px; }

  .facts td { border-top:3px solid #197683; border-bottom:1px solid #D6E7E9;
              padding:10px 16px 12px 0; width:25%; vertical-align:top; }
  .facts .k { font-size:7.5pt; letter-spacing:1.6px; text-transform:uppercase; color:#197683; padding-bottom:4px; }
  .facts .v { font-size:12pt; font-weight:bold; color:#0A2C52; line-height:1.25; }

  h2 { font-size:9pt; letter-spacing:1.8px; text-transform:uppercase; color:#197683;
       margin:26px 0 8px; padding-bottom:5px; border-bottom:2px solid #D6E7E9; }

  .quote { border-left:4px solid #197683; padding:2px 0 2px 16px; }
  .quote p { margin:0; font-size:11.5pt; line-height:1.55; color:#0D1F2D; }

  .rows td { padding:7px 0; border-bottom:1px solid #E7F1F2; vertical-align:top; }
  .rows td.k { width:34%; color:#6E747B; font-size:10pt; padding-right:14px; }
  .rows td.v { font-weight:bold; color:#0D1F2D; }

  .foot { margin-top:30px; padding-top:10px; border-top:1px solid #D6E7E9;
          font-size:8.5pt; color:#6E747B; }
</style>
</head>
<body>

<img src="data:image/png;base64,__BAND__" width="700" alt="Conference Venues, venue brief">

<p class="refline"><strong><?!= rec.ref ?></strong> &nbsp; Received <?!= rec.received ?> AEST</p>

<table class="facts" style="margin-top:14px">
  <tr>
    <? for (var i = 0; i < headline.length; i++) { ?>
      <td>
        <div class="k"><?!= headline[i].label ?></div>
        <div class="v"><?!= headline[i].value ?></div>
      </td>
    <? } ?>
  </tr>
</table>

<? if (rec.notes) { ?>
  <h2>In their words</h2>
  <div class="quote"><p><?!= escLines(rec.notes) ?></p></div>
<? } ?>

<h2>The brief</h2>
<table class="rows">
  <? for (var i = 0; i < brief.length; i++) { ?>
    <tr><td class="k"><?!= brief[i][0] ?></td><td class="v"><?!= brief[i][1] ?></td></tr>
  <? } ?>
</table>

<h2>Who sent it</h2>
<table class="rows">
  <? for (var i = 0; i < contact.length; i++) { ?>
    <tr><td class="k"><?!= contact[i][0] ?></td><td class="v"><?!= contact[i][1] ?></td></tr>
  <? } ?>
</table>

<p class="foot">
  Submitted through conferencevenues.com.au, <?!= esc(rec.source) ?>.
  Quote <?!= rec.ref ?> when you reply. The full record is in the briefs sheet.
</p>

</body>
</html>
