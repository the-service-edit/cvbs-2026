name: Deploy public CVBS website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate form delivery configuration
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          if [[ -z "$WEB3FORMS_ACCESS_KEY" ]]; then
            echo "::error::Add the WEB3FORMS_ACCESS_KEY repository secret before publishing."
            exit 1
          fi

      - name: Build public-only artifact
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: ./scripts/build-public.sh "$RUNNER_TEMP/cvbs-public"

      - name: Verify form configuration was injected
        run: |
          if grep -R "YOUR_WEB3FORMS_ACCESS_KEY" "$RUNNER_TEMP/cvbs-public" --include='*.html'; then
            echo "::error::A placeholder form key remains in the public artifact."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/cvbs-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
