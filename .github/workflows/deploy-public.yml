name: Deploy CVBS staging

# Builds the STAGING site from an allowlist and publishes only that artifact.
# The repository root is never published. Production is built with
# scripts/build.py --env production and deployed to the production host,
# which is a separate, manual, approved step. See _site/README.md.
#
# One-time setting (Mel): Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until that is set, GitHub keeps publishing the branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and verify the staging artifact
        run: python3 scripts/build.py --env staging --out "$RUNNER_TEMP/cvbs-staging"

      - name: Prove the production build still passes
        run: python3 scripts/build.py --env production --out "$RUNNER_TEMP/cvbs-production"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/cvbs-staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
